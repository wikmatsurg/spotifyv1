<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>spotify web api test</title>
        <script src="./script.js"></script>
    </head>
    <body>
        <h1>Add your top streamed songs to a new playlist</h1>
        <button type="button" id="loginButton">Login with Spotify</button><br>
        <form id="form">
            <input type="radio" id="short" name="term" value="short">
            <label for="short">Short-term data (approx. the last 4 weeks)</label><br>
            <input type="radio" id="medium" name="term" value="medium">
            <label for="medium">Medium-term data (approx. the last 6 months)</label><br>
            <input type="radio" id="long" name="term" value="long">
            <label for="long">Long-term data (approx. the last year)</label><br>
            <label for="songNum">Number of songs in the playlist: </label>
            <input id="songNum" type="number" name="songNum" value="5" min="5" max="50"/>
            <input type="submit" id="submit" value="Create playlist">
        </form>
        <p id="message"></p>
    </body>
</html>
